# ffmpeg4ubii — Linux audio-encode (libopus). Windows: build-windows-encode.yml
name: ffmpeg4ubii Linux

# Tag-only CI (same as Windows). Push: git push origin main v8.1.2-N
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FFMPEG_VARIANT: encode

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential nasm pkg-config
      - name: Install ARM64 compiler
        if: env.ARCH == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          set -o pipefail
          ./build-linux.sh 2>&1 | tee build.log
      - name: Verify encode binary
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg -path '*/bin/ffmpeg' | head -1)"
          test -n "$ff"
          bash scripts/ci-verify-encode.sh "$ff"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ matrix.arch }}-audio-encode
          path: artifacts/
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ matrix.arch }}
          path: build.log

  release-linux:
    runs-on: ubuntu-latest
    needs:
      - package-linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-linux-*
          merge-multiple: true
      - name: Make tarballs
        run: |
          set -eu
          mkdir -p release-out
          declare -A packed
          while IFS= read -r ff; do
            inst="$(dirname "$(dirname "$ff")")"
            name="$(basename "$inst")"
            case "$name" in ffmpeg-*) ;; *) continue ;; esac
            if [ -n "${packed[$name]:-}" ]; then continue; fi
            packed[$name]=1
            tar czf "release-out/${name}.tar.gz" -C "$(dirname "$inst")" "$name"
          done < <(find artifacts -type f -name ffmpeg -path '*/bin/ffmpeg')
          ls -la release-out/
          test "$(ls -A release-out)"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ffmpeg4ubii ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release-out/*