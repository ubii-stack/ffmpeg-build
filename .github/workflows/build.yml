# Linux + Windows (x86) encode/decode matrix — automatic on push/PR/tags.
# macOS: build locally with ./build-macos-local.sh (see README).
# Windows ARM64: see build-windows-arm64.yml.

name: Build static ffmpeg

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
        variant:
          - decode
          - encode
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y nasm pkg-config
      - name: Install ARM64 compiler
        if: env.ARCH == 'arm64'
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: ./build-linux.sh
      - name: Verify libopus (encode)
        if: matrix.variant == 'encode'
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg -path '*/bin/ffmpeg' | head -1)"
          test -n "$ff"
          "$ff" -hide_banner -encoders 2>&1 | grep -q libopus
          echo "ok libopus in $ff"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ env.ARCH }}-${{ env.FFMPEG_VARIANT }}
          path: artifacts/

  package-windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i686
        variant:
          - decode
          - encode
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y nasm mingw-w64 pkg-config
      - name: Build
        run: ./build-windows.sh
      - name: Verify libopus (encode)
        if: matrix.variant == 'encode'
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg.exe -path '*/bin/*' | head -1)"
          test -n "$ff"
          # Cross-built exe cannot run on Linux; check strings for libopus linkage markers.
          strings "$ff" | grep -qi 'libopus\|Opus' || {
            echo "expected Opus/libopus strings in $ff" >&2
            exit 1
          }
          echo "ok opus strings in $ff"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ env.ARCH }}-${{ env.FFMPEG_VARIANT }}
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs:
      - package-linux
      - package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-*
          merge-multiple: true
      - name: Make tarballs
        run: |
          set -eu
          mkdir -p release-out
          declare -A packed
          while IFS= read -r ff
          do
            inst="$(dirname "$(dirname "$ff")")"
            name="$(basename "$inst")"
            case "$name" in
              ffmpeg-*)
                ;;
              *)
                continue
                ;;
            esac
            if [ -n "${packed[$name]:-}" ]
            then
              continue
            fi
            packed[$name]=1
            tar czf "release-out/${name}.tar.gz" -C "$(dirname "$inst")" "$name"
          done < <(find artifacts -type f \( -name ffmpeg.exe -o -name ffmpeg \) -path '*/bin/*')
          ls -la release-out/
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release-out/*
