# Full matrix (Linux / Windows x86 / macOS). Kept for later full releases.
# Automatic push/PR triggers are off so day-to-day CI is Windows ARM64 only
# (see build-windows-arm64.yml). Re-enable push/PR/tags below when you want
# the full matrix again, or run this workflow manually (workflow_dispatch).

name: Build static ffmpeg

on:
  workflow_dispatch:
  # Uncomment to restore automatic full-matrix builds:
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - v*
  # pull_request:

jobs:
  package-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch:
          - x86_64
          - arm64
        variant:
          - decode
          - encode
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y nasm
      - name: Install ARM64 compiler
        if: env.ARCH == 'arm64'
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: ./build-linux.sh
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ env.ARCH }}-${{ env.FFMPEG_VARIANT }}
          path: artifacts/

  package-windows:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch:
          - x86_64
          - i686
        variant:
          - decode
          - encode
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y nasm mingw-w64
      - name: Build
        run: ./build-windows.sh
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ env.ARCH }}-${{ env.FFMPEG_VARIANT }}
          path: artifacts/

  package-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        # https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary#Update-the-Architecture-List-of-Custom-Makefiles
        target:
          - x86_64-apple-macos10.9
          - arm64-apple-macos11
        variant:
          - decode
          - encode
    env:
      TARGET: ${{ matrix.target }}
      FFMPEG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: brew install nasm
      - name: Build
        run: ./build-macos.sh
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}-${{ env.FFMPEG_VARIANT }}
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs:
      - package-linux
      - package-windows
      - package-macos
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-*
          merge-multiple: true
      - name: Make tarballs
        run: |
          set -eu
          mkdir -p release-out
          declare -A packed
          while IFS= read -r ff
          do
            inst="$(dirname "$(dirname "$ff")")"
            name="$(basename "$inst")"
            case "$name" in
              ffmpeg-*)
                ;;
              *)
                continue
                ;;
            esac
            if [ -n "${packed[$name]:-}" ]
            then
              continue
            fi
            packed[$name]=1
            tar czf "release-out/${name}.tar.gz" -C "$(dirname "$inst")" "$name"
          done < <(find artifacts -type f \( -name ffmpeg.exe -o -name ffmpeg \) -path '*/bin/*')
          ls -la release-out/
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
