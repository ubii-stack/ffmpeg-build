# Windows audio-encode only (libopus). Linux follows once this matrix is green.
name: Build Windows encode

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package-windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i686
    env:
      ARCH: ${{ matrix.arch }}
      FFMPEG_VARIANT: encode
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm mingw-w64 pkg-config
      - name: Build
        run: ./build-windows.sh
      - name: Verify encode binary
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg.exe -path '*/bin/*' | head -1)"
          test -n "$ff"
          bash scripts/ci-verify-encode.sh "$ff"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ matrix.arch }}-audio-encode
          path: artifacts/

  package-windows-arm64:
    runs-on: ubuntu-22.04
    env:
      ARCH: aarch64
      FFMPEG_VARIANT: encode
      LLVM_MINGW_VERSION: "20261006"
    steps:
      - uses: actions/checkout@v4
      - name: Install nasm + pkg-config
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm pkg-config
      - name: Install llvm-mingw
        run: |
          set -eu
          asset="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${asset}"
          curl -fsSL -o /tmp/llvm-mingw.tar.xz "$url"
          sudo tar -C /opt -xf /tmp/llvm-mingw.tar.xz
          prefix="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "${prefix}/bin" >> "$GITHUB_PATH"
          "${prefix}/bin/aarch64-w64-mingw32-gcc" --version
      - name: Build
        run: ./build-windows.sh
      - name: Verify encode binary
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg.exe -path '*/bin/*' | head -1)"
          test -n "$ff"
          bash scripts/ci-verify-encode.sh "$ff"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-aarch64-audio-encode
          path: artifacts/

  release-windows:
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-windows-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-windows-*
          merge-multiple: true
      - name: Make tarballs
        run: |
          set -eu
          mkdir -p release-out
          declare -A packed
          while IFS= read -r ff; do
            inst="$(dirname "$(dirname "$ff")")"
            name="$(basename "$inst")"
            case "$name" in ffmpeg-*) ;; *) continue ;; esac
            if [ -n "${packed[$name]:-}" ]; then continue; fi
            packed[$name]=1
            tar czf "release-out/${name}.tar.gz" -C "$(dirname "$inst")" "$name"
          done < <(find artifacts -type f -name ffmpeg.exe -path '*/bin/*')
          ls -la release-out/
          test "$(ls -A release-out)"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release-out/*