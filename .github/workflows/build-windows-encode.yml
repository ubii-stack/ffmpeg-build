# ffmpeg4ubii — Windows audio-encode (libopus). Linux follows when enabled.
name: ffmpeg4ubii Windows

# One CI run per release: tag push only (not main). Push commit+tag together:
#   git push origin main v8.1.2-N
# Linux + Windows encode jobs both attach assets to the same release.
on:
  workflow_dispatch:
  push:
    tags: [v*]

permissions:
  contents: write
  actions: read

env:
  FFMPEG_VARIANT: encode
  LLVM_MINGW_VERSION: "20261006"

jobs:
  package-windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential nasm pkg-config curl
      - name: Install llvm-mingw
        run: |
          set -eu
          asset="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${asset}"
          curl -fsSL -o /tmp/llvm-mingw.tar.xz "$url"
          sudo tar -C /opt -xf /tmp/llvm-mingw.tar.xz
          prefix="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "${prefix}/bin" >> "$GITHUB_PATH"
          "${prefix}/bin/${ARCH}-w64-mingw32-gcc" --version
      - name: Build
        run: |
          set -o pipefail
          ./build-windows.sh 2>&1 | tee build.log
      - name: Verify encode binary
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg4ubii.exe -path '*/bin/*' | head -1)"
          test -n "$ff"
          bash scripts/ci-verify-encode.sh "$ff"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ matrix.arch }}-audio-encode
          path: artifacts/
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log

  release-windows:
    runs-on: ubuntu-latest
    needs:
      - package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-windows-*
          merge-multiple: true
      - name: Make tarballs
        run: |
          set -eu
          mkdir -p release-out
          declare -A packed
          while IFS= read -r ff; do
            inst="$(dirname "$(dirname "$ff")")"
            name="$(basename "$inst")"
            case "$name" in ffmpeg-*) ;; *) continue ;; esac
            if [ -n "${packed[$name]:-}" ]; then continue; fi
            packed[$name]=1
            tar czf "release-out/${name}.tar.gz" -C "$(dirname "$inst")" "$name"
          done < <(find artifacts -type f -name ffmpeg4ubii.exe -path '*/bin/*')
          ls -la release-out/
          test "$(ls -A release-out)"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ffmpeg4ubii ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release-out/*