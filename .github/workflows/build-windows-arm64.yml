# Windows ARM64 (aarch64-w64-mingw32) only.
# Uses llvm-mingw — apt mingw-w64 does not ship an aarch64 Windows target.
# Original full matrix remains in build.yml (left unchanged for later).

name: Build Windows ARM64 ffmpeg

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

# New/forked repos default workflow token to read-only. Job-level permissions are
# not always enough — release needs write at workflow level on tag builds (see README).
permissions:
  contents: write
  actions: read

jobs:
  package-windows-arm64:
    runs-on: ubuntu-22.04
    env:
      ARCH: aarch64
      # ubii ships audio-encode only (transcode / Opus); decode-only is for Chromaprint upstream.
      FFMPEG_VARIANT: encode
      LLVM_MINGW_VERSION: "20261006"
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm

      - name: Install llvm-mingw (aarch64-w64-mingw32)
        run: |
          set -eu
          asset="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${asset}"
          curl -fsSL -o /tmp/llvm-mingw.tar.xz "$url"
          sudo tar -C /opt -xf /tmp/llvm-mingw.tar.xz
          prefix="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          echo "${prefix}/bin" >> "$GITHUB_PATH"
          "${prefix}/bin/aarch64-w64-mingw32-gcc" --version

      - name: Build
        run: ./build-windows.sh

      - name: Verify libopus linkage
        run: |
          set -eu
          ff="$(find artifacts -type f -name ffmpeg.exe -path '*/bin/*' | head -1)"
          test -n "$ff"
          strings "$ff" | grep -qi 'libopus\|Opus' || {
            echo "expected Opus/libopus strings in $ff" >&2
            exit 1
          }
          echo "ok opus strings in $ff"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-aarch64-audio-encode
          path: artifacts/

  release-windows-arm64:
    runs-on: ubuntu-latest
    needs:
      - package-windows-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-windows-aarch64-*
          merge-multiple: true
      - name: Make tarballs (Acoustid-style release assets)
        run: |
          set -eu
          mkdir -p release-out
          declare -A packed
          while IFS= read -r ff
          do
            inst="$(dirname "$(dirname "$ff")")"
            name="$(basename "$inst")"
            case "$name" in
              ffmpeg-*)
                ;;
              *)
                continue
                ;;
            esac
            if [ -n "${packed[$name]:-}" ]
            then
              continue
            fi
            packed[$name]=1
            tar czf "release-out/${name}.tar.gz" -C "$(dirname "$inst")" "$name"
            echo "packed release-out/${name}.tar.gz"
          done < <(find artifacts -type f \( -name ffmpeg.exe -o -name ffmpeg \) -path '*/bin/*')
          ls -la release-out/
          if [ ! "$(ls -A release-out)" ]
          then
            echo "No ffmpeg install trees found under artifacts/" >&2
            find artifacts -maxdepth 4 -type d >&2
            exit 1
          fi
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-out/*